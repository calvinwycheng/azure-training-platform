<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565c0">
  <title>Azure Training Platform</title>
  <link rel="icon" type="image/png" href="assets/ai103-logo.png">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-panel">
      <div class="auth-brand"><img class="auth-logo" src="assets/ai103-logo.png" alt="Azure Training Platform"><div><strong>Azure Training Platform</strong><span>登录后继续你的学习进度</span></div></div>
      <div class="auth-tabs"><button class="active" data-auth-tab="login">登录</button><button data-auth-tab="register">注册</button></div>
      <form id="authForm"><label>用户名<input id="authUsername" autocomplete="username" minlength="2" required></label><label>密码<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label><label id="confirmPasswordRow" hidden>确认密码<input id="authPasswordConfirm" type="password" minlength="6"></label><div class="auth-error" id="authError" role="alert"></div><button class="button primary" id="authSubmit" type="submit">登录</button></form>
    </div>
  </section>
  <section class="course-entry-screen" id="courseEntryScreen" hidden>
    <div class="course-entry-panel">
      <div class="course-entry-heading"><span>Azure Training Platform</span><h1>选择学习课程</h1><p>选择一个认证课程进入学习工作区，之后可以随时切换。</p></div>
      <div class="course-entry-grid" id="courseEntryGrid"></div>
    </div>
  </section>
  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/ai103-logo.png" alt="AI-103">
        <div><strong>Azure Training Platform</strong><span>本地学习工作区</span></div>
      </div>
      <label class="course-switcher">学习课程<select id="courseSelector" aria-label="选择课程"></select></label>
      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span>学习概览</button>
        <button class="nav-item" data-action="start-all"><span>▶</span>继续练习</button>
        <button class="nav-item" data-view="questions"><span>▦</span>题库浏览</button>
        <button class="nav-item" data-view="wrong"><span>!</span>错题本</button>
        <button class="nav-item" data-view="bookmarks"><span>★</span>收藏题</button>
        <button class="nav-item" data-view="cases"><span>▤</span>案例资料</button>
        <button class="nav-item" data-view="stats"><span>▥</span>学习统计</button>
        <button class="nav-item admin-only" data-view="admin" hidden><span>♙</span>用户管理</button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-view="settings"><span>⚙</span>设置与备份</button>
        <div class="save-indicator" id="saveIndicator"><span></span>进度已保存</div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" title="打开导航" aria-label="打开导航">☰</button>
        <div class="page-title" id="pageTitle">学习概览</div>
        <div class="top-actions">
          <label class="search-box"><span>⌕</span><input id="globalSearch" type="search" placeholder="搜索题号或关键词"></label>
          <button class="icon-button" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
          <div class="user-menu"><span id="currentUsername"></span><button class="button small" id="logoutButton">退出</button></div>
        </div>
      </header>
      <main id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <div class="mobile-nav" aria-label="移动端导航">
    <button data-view="dashboard"><span>⌂</span>概览</button>
    <button data-action="start-all"><span>▶</span>练习</button>
    <button data-view="wrong"><span>!</span>错题</button>
    <button data-view="bookmarks"><span>★</span>收藏</button>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header><h2 id="modalTitle"></h2><button class="icon-button" id="modalClose" title="关闭" aria-label="关闭">×</button></header>
      <div id="modalContent" class="modal-content"></div>
    </section>
  </div>

  <input type="file" id="importInput" accept="application/json" hidden>
  <script src="data/questions.js?v=18"></script>
  <script src="data/dp600-questions.js?v=12"></script>
  <script src="data/courses.js?v=2"></script>
  <script src="db.js?v=6"></script>
  <script src="app.js?v=27"></script>
</body>
</html>
