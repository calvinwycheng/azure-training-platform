services:
  azure-training-platform:
    image: calvinwyc/azure-training-platform:1.0.2
    build: .
    ports:
      - "5000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - azure_training_data:/app/storage
    restart: unless-stopped
volumes:
  azure_training_data:
